<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">

<title>عجلة الحظ</title>

<script src="https://telegram.org/js/telegram-web-app.js"></script>

<style>
* {
    box-sizing: border-box;
}

html,
body {
    margin: 0;
    min-height: 100%;
    font-family: Arial, sans-serif;
    background: #111827;
    color: #fff;
}

body {
    display: flex;
    justify-content: center;
    align-items: center;
    padding: 18px;
}

.card {
    width: min(430px, 100%);
    text-align: center;
    background: #1f2937;
    border-radius: 24px;
    padding: 20px;
    box-shadow: 0 15px 45px rgba(0, 0, 0, .35);
}

h1 {
    margin: 4px 0 8px;
    font-size: 27px;
}

.sub {
    opacity: .8;
    margin: 0 0 18px;
    font-size: 14px;
}

.wheel-wrap {
    position: relative;
    width: min(340px, 88vw);
    height: min(340px, 88vw);
    margin: 8px auto 22px;
}

.pointer {
    position: absolute;
    z-index: 5;
    top: -8px;
    left: 50%;
    transform: translateX(-50%);
    width: 0;
    height: 0;
    border-left: 16px solid transparent;
    border-right: 16px solid transparent;
    border-top: 32px solid #ef4444;
    filter: drop-shadow(0 2px 2px #000);
}

.wheel {
    width: 100%;
    height: 100%;
    border-radius: 50%;
    border: 8px solid #f9fafb;
    position: relative;
    overflow: hidden;
    transform: rotate(0deg);
    transition: transform 5s cubic-bezier(.12, .7, .12, 1);
    box-shadow: 0 8px 30px rgba(0, 0, 0, .45);
}

.seg {
    position: absolute;
    width: 50%;
    height: 50%;
    left: 50%;
    top: 0;
    transform-origin: 0 100%;
    clip-path: polygon(0 0, 100% 0, 0 100%);
    display: flex;
    align-items: flex-start;
    justify-content: center;
    padding-top: 24px;
    padding-left: 30px;
    font-weight: bold;
    font-size: 13px;
    text-align: center;
}

.s0 {
    transform: rotate(0deg);
    background: #ef4444;
}

.s1 {
    transform: rotate(51.428deg);
    background: #f59e0b;
}

.s2 {
    transform: rotate(102.856deg);
    background: #10b981;
}

.s3 {
    transform: rotate(154.284deg);
    background: #3b82f6;
}

.s4 {
    transform: rotate(205.712deg);
    background: #8b5cf6;
}

.s5 {
    transform: rotate(257.14deg);
    background: #ec4899;
}

.s6 {
    transform: rotate(308.568deg);
    background: #14b8a6;
}

.center {
    position: absolute;
    z-index: 4;
    left: 50%;
    top: 50%;
    transform: translate(-50%, -50%);
    width: 70px;
    height: 70px;
    border-radius: 50%;
    background: #111827;
    border: 5px solid #fff;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 25px;
}

button {
    width: 100%;
    border: 0;
    border-radius: 14px;
    padding: 15px;
    background: #22c55e;
    color: #fff;
    font-size: 18px;
    font-weight: bold;
    cursor: pointer;
}

button:disabled {
    opacity: .5;
    cursor: not-allowed;
}

#result {
    margin-top: 16px;
    font-size: 20px;
    font-weight: bold;
    min-height: 28px;
}

.note {
    font-size: 12px;
    opacity: .6;
    margin-top: 12px;
}
</style>
</head>

<body>

<div class="card">

    <h1>🎁 عجلة الحظ</h1>

    <p class="sub">
        اضغط وخلّي العجلة تدور!
    </p>

    <div class="wheel-wrap">

        <div class="pointer"></div>

        <div id="wheel" class="wheel">

            <div class="seg s0">محاولة أخرى</div>
            <div class="seg s1">بونص 10%</div>
            <div class="seg s2">بونص 5%</div>
            <div class="seg s3">حظ أوفر</div>
            <div class="seg s4">+2,000</div>
            <div class="seg s5">+5,000</div>
            <div class="seg s6">+10,000</div>

            <div class="center">🎡</div>

        </div>

    </div>

    <button id="spinBtn">
        🎡 ابدأ الدوران
    </button>

    <div id="result"></div>

    <div class="note">
        النتيجة يتم اعتمادها من البوت بعد انتهاء الدوران.
    </div>

</div>

<script>

/* =========================================
   Telegram WebApp
========================================= */

const tg =
    window.Telegram &&
    window.Telegram.WebApp
        ? window.Telegram.WebApp
        : null;

if (tg) {
    tg.ready();
    tg.expand();
}


/* =========================================
   قراءة Token
========================================= */

const params = new URLSearchParams(
    window.location.search
);

const token = params.get("token");

const wheel =
    document.getElementById("wheel");

const btn =
    document.getElementById("spinBtn");

const result =
    document.getElementById("result");

let spinning = false;


/* =========================================
   استخراج رقم الجائزة من Token
========================================= */

function getPrizeIndexFromToken(token) {

    try {

        if (!token) {
            return null;
        }

        const raw =
            token.split(".")[0];

        const padding =
            "=".repeat(
                (4 - (raw.length % 4)) % 4
            );

        const decoded =
            atob(
                raw
                    .replace(/-/g, "+")
                    .replace(/_/g, "/")
                + padding
            );

        const parts =
            decoded.split(":");

        if (parts.length < 4) {
            return null;
        }

        const prizeIndex =
            parseInt(parts[1], 10);

        if (
            isNaN(prizeIndex) ||
            prizeIndex < 0 ||
            prizeIndex > 6
        ) {
            return null;
        }

        return prizeIndex;

    } catch (e) {

        console.error(
            "TOKEN ERROR:",
            e
        );

        return null;
    }
}


/* =========================================
   إرسال النتيجة للبوت
========================================= */

function sendResult() {

    if (!tg) {

        result.textContent =
            "⚠️ افتح العجلة من داخل Telegram.";

        btn.disabled = false;
        spinning = false;

        return;
    }

    if (!token) {

        result.textContent =
            "❌ رابط العجلة غير صالح.";

        btn.disabled = false;
        spinning = false;

        return;
    }

    try {

        tg.sendData(
            JSON.stringify({
                token: token
            })
        );

        result.textContent =
            "✅ تم إرسال النتيجة للبوت.";

        setTimeout(() => {

            try {
                tg.close();
            } catch (e) {}

        }, 700);

    } catch (e) {

        console.error(
            "SEND DATA ERROR:",
            e
        );

        result.textContent =
            "❌ حدث خطأ أثناء إرسال النتيجة.";

        btn.disabled = false;
        spinning = false;
    }
}


/* =========================================
   تشغيل العجلة
========================================= */

btn.addEventListener(
    "click",
    function () {

        if (spinning) {
            return;
        }

        if (!token) {

            result.textContent =
                "❌ رابط العجلة غير صالح.";

            return;
        }

        const prizeIndex =
            getPrizeIndexFromToken(token);

        if (prizeIndex === null) {

            result.textContent =
                "❌ تعذر تحديد نتيجة العجلة.";

            return;
        }

        spinning = true;
        btn.disabled = true;

        result.textContent =
            "🎡 العجلة تدور...";


        /* زاوية كل قسم */

        const segmentAngle =
            360 / 7;


        /*
         * وضع مركز الجائزة
         * تحت المؤشر الموجود بالأعلى
         */

        const targetAngle =
            360 -
            (
                prizeIndex *
                segmentAngle +
                segmentAngle / 2
            );


        /*
         * 6 دورات كاملة
         */

        const extraRounds =
            6 * 360;


        const finalRotation =
            extraRounds +
            targetAngle;


        wheel.style.transform =
            "rotate(" +
            finalRotation +
            "deg)";


        /* انتظار انتهاء الدوران */

        setTimeout(
            function () {

                const prizeNames = [

                    "🔄 محاولة أخرى",

                    "🎁 بونص 10%",

                    "🎁 بونص 5%",

                    "🍀 حظ أوفر",

                    "💰 +2,000",

                    "💰 +5,000",

                    "💰 +10,000"
                ];


                result.textContent =
                    "🎉 " +
                    prizeNames[prizeIndex];


                /*
                 * إرسال النتيجة للبوت
                 */

                setTimeout(
                    function () {
                        sendResult();
                    },
                    500
                );

            },
            5200
        );
    }
);

</script>

</body>
</html>
