<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>عجلة الحظ</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
*{box-sizing:border-box}html,body{margin:0;min-height:100%;font-family:Tahoma,Arial,sans-serif;background:radial-gradient(circle at top,#253b73,#0b1020 70%);color:#fff}body{display:flex;justify-content:center;align-items:center;padding:18px}.card{width:min(96vw,520px);padding:18px 14px 22px;border-radius:26px;background:rgba(255,255,255,.08);box-shadow:0 18px 60px rgba(0,0,0,.35);backdrop-filter:blur(12px);text-align:center}.title{font-size:25px;font-weight:800;margin:2px 0 5px}.sub{font-size:14px;opacity:.8;margin-bottom:12px}.wheel-wrap{position:relative;width:min(88vw,430px);aspect-ratio:1;margin:0 auto 16px}.wheel{position:absolute;inset:0;border-radius:50%;filter:drop-shadow(0 12px 18px rgba(0,0,0,.35));transition:transform 6.2s cubic-bezier(.12,.72,.12,1);will-change:transform}.wheel svg{width:100%;height:100%;display:block;overflow:visible}.hub{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:23%;height:23%;border-radius:50%;background:#fff;box-shadow:0 5px 20px rgba(0,0,0,.35);display:grid;place-items:center;color:#10182e;font-size:13px;font-weight:900;border:7px solid rgba(255,255,255,.35);z-index:3}.pointer{position:absolute;z-index:5;left:50%;top:-2px;transform:translateX(-50%);width:0;height:0;border-left:17px solid transparent;border-right:17px solid transparent;border-top:36px solid #fff;filter:drop-shadow(0 4px 5px rgba(0,0,0,.4))}.spin{border:0;border-radius:16px;width:100%;padding:15px 18px;font-size:18px;font-weight:800;background:#fff;color:#111a35;cursor:pointer;box-shadow:0 8px 24px rgba(0,0,0,.25)}.spin:disabled{opacity:.55;cursor:not-allowed}.status{min-height:28px;margin-top:12px;font-weight:700;font-size:15px}.result{display:none;margin-top:10px;padding:14px;border-radius:16px;background:rgba(255,255,255,.12);font-size:18px;font-weight:800}.result.show{display:block}.small{font-size:11px;opacity:.6;margin-top:10px}
</style>
</head>
<body>
<div class="card">
  <div class="title">🎁 عجلة الحظ</div>
  <div class="sub">لفّ العجلة وشاهد جائزتك 🎉</div>
  <div class="wheel-wrap">
    <div class="pointer"></div>
    <div class="wheel" id="wheel">
      <svg viewBox="0 0 500 500" aria-label="عجلة الحظ">
        <g id="segments"></g>
        <circle cx="250" cy="250" r="247" fill="none" stroke="rgba(255,255,255,.85)" stroke-width="8"/>
      </svg>
    </div>
    <div class="hub">SPIN</div>
  </div>
  <button class="spin" id="spinBtn">🎡 ابدأ الدوران</button>
  <div class="status" id="status"></div>
  <div class="result" id="result"></div>
  <div class="small">النتيجة مثبتة من السيرفر ولا يمكن تغييرها من العجلة.</div>
</div>
<script>
const tg = window.Telegram && window.Telegram.WebApp ? window.Telegram.WebApp : null;
if(tg){ tg.ready(); tg.expand(); }
const prizes = [
  {label:'محاولة أخرى', icon:'🔄'},
  {label:'بونص 10%', icon:'🎁'},
  {label:'بونص 5%', icon:'🎁'},
  {label:'حظ أوفر', icon:'🍀'},
  {label:'+2,000 ل.س', icon:'💰'},
  {label:'+5,000 ل.س', icon:'💰'},
  {label:'+10,000 ل.س', icon:'💰'}
];
const colors = ['#ff6b6b','#ffd166','#06d6a0','#4dabf7','#b197fc','#f783ac','#ffa94d'];
const cx=250, cy=250, r=238, n=prizes.length, step=360/n;
const g=document.getElementById('segments');
function polar(a,rad){const t=(a-90)*Math.PI/180;return [cx+rad*Math.cos(t),cy+rad*Math.sin(t)]}
function sectorPath(a0,a1){const [x0,y0]=polar(a0,r),[x1,y1]=polar(a1,r);const large=(a1-a0)>180?1:0;return `M ${cx} ${cy} L ${x0} ${y0} A ${r} ${r} 0 ${large} 1 ${x1} ${y1} Z`}
prizes.forEach((p,i)=>{
  const a0=i*step,a1=(i+1)*step;
  const path=document.createElementNS('http://www.w3.org/2000/svg','path');
  path.setAttribute('d',sectorPath(a0,a1));path.setAttribute('fill',colors[i]);path.setAttribute('stroke','rgba(255,255,255,.75)');path.setAttribute('stroke-width','3');g.appendChild(path);
  const [tx,ty]=polar(i*step+step/2,145);
  const text=document.createElementNS('http://www.w3.org/2000/svg','text');
  text.setAttribute('x',tx);text.setAttribute('y',ty);text.setAttribute('text-anchor','middle');text.setAttribute('dominant-baseline','middle');text.setAttribute('fill','#111');text.setAttribute('font-size','18');text.setAttribute('font-weight','800');text.setAttribute('transform',`rotate(${i*step+step/2} ${tx} ${ty})`);
  const t1=document.createElementNS('http://www.w3.org/2000/svg','tspan');t1.textContent=p.icon+' '+p.label;text.appendChild(t1);g.appendChild(text);
});
function decodeToken(token){
  const raw=token.split('.')[0];
  let s=raw.replace(/-/g,'+').replace(/_/g,'/');while(s.length%4)s+='=';
  const payload=decodeURIComponent(escape(atob(s)));
  const parts=payload.split(':');
  return {index:Number(parts[1]),nonce:parts[2]};
}
const params=new URLSearchParams(location.search);const token=params.get('token')||'';
let decoded=null;
try{decoded=decodeToken(token)}catch(e){}
const wheel=document.getElementById('wheel'),btn=document.getElementById('spinBtn'),status=document.getElementById('status'),result=document.getElementById('result');
let done=false;
btn.addEventListener('click',()=>{
  if(done)return;
  if(!token||!decoded||decoded.index<0||decoded.index>=n){status.textContent='❌ رابط العجلة غير صالح أو منتهي.';btn.disabled=true;return;}
  done=true;btn.disabled=true;status.textContent='🎡 العجلة تدور...';
  const index=decoded.index;
  // Segment center must land under the pointer at 12 o'clock.
  const target=(360-(index*step+step/2))%360;
  const current=0;
  const extra=360*6;
  wheel.style.transform=`rotate(${extra+target-current}deg)`;
  setTimeout(()=>{
    status.textContent='🎉 توقفت العجلة!';
    result.textContent=`${prizes[index].icon} ${prizes[index].label}`;result.classList.add('show');
    setTimeout(()=>{
      if(tg){
        try{tg.sendData(JSON.stringify({token:token}));return;}catch(e){}
      }
      status.textContent='افتح العجلة من داخل Telegram لإتمام احتساب الجائزة.';
    },900);
  },6500);
});
</script>
</body>
</html>
